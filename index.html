<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PET JOB 打工仔電子工作證</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-sizing: border-box;
    }
    .profile-img {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffb74d;
      margin-bottom: 12px;
    }
    .user-name {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      margin: 0 0 6px 0;
    }
    .title-tag {
      display: inline-block;
      background: #ffe0b2;
      color: #e65100;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .barcode-container {
      background: #f9f9f9;
      border: 2px dashed #e0e0e0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    #barcodeCanvas {
      max-width: 100%;
    }
    #countdown {
      font-size: 13px;
      color: #888888;
      margin-top: 6px;
    }
    .notice {
      font-size: 12px;
      color: #aaa;
    }
  </style>
  <!-- 載入 LINE SDK 與 條碼套件 -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

  <div class="card">
    <!-- 預設頭像 -->
    <img id="userPicture" class="profile-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=PetJob" alt="毛孩大頭照">
    <h2 id="userName" class="user-name">PET JOB 打工仔</h2>
    <span class="title-tag">🐾 星萌克資深實習生</span>

    <div class="barcode-container">
      <svg id="barcodeCanvas"></svg>
      <div id="countdown">正在生成動態核銷碼...</div>
    </div>
    <div class="notice">※ 請勿截圖，條碼自動刷新即可核銷</div>
  </div>

  <script>
    // 您的 Google Apps Script Web App 網址
    const GAS_API_URL = "ttps://script.google.com/macros/s/AKfycbx_4LEmaLpOrdqoZeLWOZJvd_E_WYqNqcD67JOy1-vbD9O9XiaiaaJsdYYXl6lx41wy/exec";

    async function initLIFF() {
      try {
        await liff.init({ liffId: "2011800095-eb02a9W4" });

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById("userName").innerText = profile.displayName;
          if (profile.pictureUrl) {
            document.getElementById("userPicture").src = profile.pictureUrl;
          }
          fetchDynamicToken(profile.userId);
        } else {
          // 若在外部瀏覽器則自動跳轉 LINE 登入
          liff.login();
        }
      } catch (err) {
        console.error("LIFF 初始化失敗：", err);
        // 若 LIFF 初始化失敗，依然帶入預設條碼
        fetchDynamicToken("GUEST_USER");
      }
    }

    function fetchDynamicToken(userId) {
      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "get_profile_and_token",
          userId: userId
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          JsBarcode("#barcodeCanvas", data.dynamicToken, {
            format: "CODE128",
            height: 70,
            displayValue: true,
            fontSize: 13
          });
          document.getElementById("countdown").innerText = `條碼刷新剩餘：${data.expiresIn} 秒`;
          setTimeout(() => fetchDynamicToken(userId), 30000);
        }
      })
      .catch(err => {
        console.error("抓取 Token 失敗：", err);
      });
    }

    initLIFF();
  </script>

</body>
</html>
