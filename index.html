<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PET JOB 打工仔電子工作證</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 12px;
    }
    .user-name {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin: 0 0 4px 0;
    }
    .title-tag {
      display: inline-block;
      background: #ffe0b2;
      color: #e65100;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .barcode-container {
      background: #fafafa;
      border: 1px dashed #cccccc;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    #countdown {
      font-size: 13px;
      color: #777777;
    }
  </style>
  <!-- 引入 LINE LIFF SDK 與 JsBarcode 繪圖套件 -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

  <div class="card">
    <img id="userPicture" class="profile-img" src="https://via.placeholder.com/80" alt="大頭照">
    <h2 id="userName" class="user-name">載入中...</h2>
    <span class="title-tag">🐾 萌寵打工仔</span>

    <div class="barcode-container">
      <svg id="barcodeCanvas"></svg>
      <div id="countdown">條碼產生中...</div>
    </div>
  </div>

  <script>
    // ⚠️ 請把引號內的網址換成步驟 2 部署後取得的 Web App URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx_4LEmaLpOrdqoZeLWOZJvd_E_WYqNqcD67JOy1-vbD9O9XiaiaaJsdYYXl6lx41wy/exec";

    async function initLIFF() {
      try {
        // 初始化 LIFF SDK
        await liff.init({ liffId: "2011800095-eb02a9W4" });

        if (!liff.isLoggedIn()) {
          liff.login(); // 若未登入自動導向 LINE 登入畫面
        } else {
          // 取得用戶 LINE Profile 資料
          const profile = await liff.getProfile();
          document.getElementById("userName").innerText = profile.displayName;
          if (profile.pictureUrl) {
            document.getElementById("userPicture").src = profile.pictureUrl;
          }

          // 向 GAS 後台索取 60 秒動態驗證碼
          fetchDynamicToken(profile.userId);
        }
      } catch (err) {
        console.error("LIFF 初始化失敗：", err);
      }
    }

    function fetchDynamicToken(userId) {
      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "get_profile_and_token",
          userId: userId
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          // 繪製條碼到 <svg id="barcodeCanvas"> 上
          JsBarcode("#barcodeCanvas", data.dynamicToken, {
            format: "CODE128",
            height: 70,
            displayValue: true,
            fontSize: 14
          });

          document.getElementById("countdown").innerText = `刷新倒數：${data.expiresIn} 秒`;

          // 每 30 秒向後台重新整理動態條碼
          setTimeout(() => fetchDynamicToken(userId), 30000);
        }
      })
      .catch(err => console.error("抓取動態條碼失敗：", err));
    }

    // 啟動 LIFF
    initLIFF();
  </script>

</body>
</html>
